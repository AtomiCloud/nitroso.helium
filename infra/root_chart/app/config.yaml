# yaml-language-server: $schema=./schema.json
$schema: ./schema.json

app:
  landscape: lapras
  platform: nitroso
  service: helium
  module: pollee
  version: '1.0'
  searcher:
    mode: web
    apiUrl: 'https://shuttleonline-api.ktmb.com.my'
    appUrl: 'https://online-api.ktmb.com.my'
    requestSignature: '4dcc60f2-91ba-478b-a849-834202a1a542'
  populator:
    delay: 0.5
  watcher:
    delay: 1
auth:
  descope:
    id: 'P2Ya46UVwFV8nTwNGZWpxRtyL7Jj'
    key: ''

zinc:
  domain: 'zinc-api'
  scheme: http

error:
  scheme: http
  enabled: true
  host: localhost:3000
cache:
  live:
    autoResubscribe: true
    commandTimeout: 3000
    connectTimeout: 3000
    enableAutoPipelining: true
    endpoints:
      0: tin-livecache-master:6379
    keyPrefix: ''
    password: supersecret
    readOnly: false
    tls: false
otel:
  logging:
    enabled: true
    level: info
    prettify: false
    safe: true
  metrics:
    exporter:
      interval: 1000
      use: none
  trace:
    exporter:
      use: none
